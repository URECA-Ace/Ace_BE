plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ace'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'net.datafaker:datafaker:2.7.0'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'redis-integration', 'redis-benchmark'
	}
}

tasks.register('redisIntegrationTest', Test) {
	description = '로컬 Docker Redis 기반 통합 테스트'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'redis-integration'
	}
	shouldRunAfter tasks.named('test')
	systemProperty 'redis.host', System.getProperty('redis.host', 'localhost')
	systemProperty 'redis.port', System.getProperty('redis.port', '6379')
}

tasks.register('redisLuaBenchmark', Test) {
	description = '최적화 전후 Redis Lua 성능 비교'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'redis-benchmark'
	}
	shouldRunAfter tasks.named('test')
	systemProperty 'redis.host', System.getProperty('redis.benchmark.host', 'localhost')
	systemProperty 'redis.port', System.getProperty('redis.benchmark.port', '6380')
	systemProperty 'benchmark.mode', System.getProperty('benchmark.mode', 'compare')
	systemProperty 'benchmark.requests', System.getProperty('benchmark.requests', '20000')
	systemProperty 'benchmark.workers', System.getProperty('benchmark.workers', '128')
	systemProperty 'benchmark.report.directory', 'build/reports/redis-lua-benchmark'
}

// 1. Git Hook 파일을 복사하는 Task 등록
tasks.register('installGitHooks', Copy) {
    from new File(rootProject.rootDir, '.githooks')
    into { new File(rootProject.rootDir, '.git/hooks') }
    // 파일에 실행 권한(chmod +x) 부여
	filePermissions {
		unix(0775)
	}
}

// 2. Java 컴파일이 실행될 때마다 installGitHooks Task를 먼저 실행하도록 의존성 설정
tasks.named('compileJava') {
    dependsOn 'installGitHooks'
}

tasks.named('bootRun') {
	systemProperty 'generate.dummy', System.getProperty('generate.dummy')
}
