name: ace

services:
  mysql:
    image: mysql:8.4
    container_name: ace-mysql
    restart: unless-stopped
    ports:
      # 로컬에 설치된 MySQL(3306)과 충돌하지 않도록 호스트 포트는 3307 을 씁니다.
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      # root 계정으로 접속합니다. mysql 이미지는 MYSQL_USER=root 를 허용하지 않으므로
      # 별도 계정 없이 MYSQL_ROOT_PASSWORD 만 지정합니다.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ace}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --skip-name-resolve
    volumes:
      - mysql-data:/var/lib/mysql
      # 최초 기동(볼륨이 비어 있을 때) 시 이 디렉터리의 .sql 이 사전순으로 실행됩니다.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ace-net

  redis:
    image: redis:8.2
    container_name: ace-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --save
      - "60"
      - "1"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - ace-net

  redis-benchmark:
    image: redis:8.2
    container_name: ace-redis-benchmark
    profiles: ["benchmark"]
    ports:
      - "${REDIS_BENCHMARK_PORT:-6380}:6379"
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory-policy
      - noeviction
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      - ace-net

  kafka:
    image: apache/kafka:4.3.1
    container_name: ace-kafka
    restart: unless-stopped
    # 명명된 볼륨은 root 소유로 생성되는데 이미지 기본 사용자(appuser)는 쓰기 권한이 없어
    # 로컬 개발용으로 root 로 실행합니다.
    user: root
    ports:
      # 호스트(IDE 에서 실행하는 Spring)에서 접속하는 포트
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # --- KRaft (Zookeeper 없음) 단일 노드 ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-AceLocalDevCluster0}
      # --- 리스너: 컨테이너끼리는 kafka:19092, 호스트에서는 localhost:9092 ---
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- 단일 브로커용 설정 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ace-net
  restore:
    image: alpine
    volumes:
      - mysql-data:/volume
      - ./dump:/backup
    profiles: ["restore"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        FILE=$$(ls -t /backup/*.tar.gz | head -n1)
        if [ -z "$$FILE" ]; then
          echo "복원할 tar.gz 파일이 dump 폴더에 없습니다."
          exit 1
        fi
        echo "복원 파일: $$FILE"
        rm -rf /volume/*
        tar xzf "$$FILE" -C /volume
        echo "복원 완료"
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: ace-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - ace-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ace-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - ace-net

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:

networks:
  ace-net:
    driver: bridge
