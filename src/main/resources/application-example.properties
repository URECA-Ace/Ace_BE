spring.application.name=ace-be

spring.datasource.url=jdbc:mysql://localhost:3307/[your_db]?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=[your_id]
spring.datasource.password=[your_pw]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Lua 단계별 실패 카운터: coupon_redis_lua_failures_total
management.endpoints.web.exposure.include=health,info,prometheus

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# 캠페인 마감 후 Redis 판정 데이터 보존 기간과 LocalDateTime 해석 기준
coupon.issue.redis.retention=PT168H
coupon.issue.redis.zone-id=Asia/Seoul

# API와 DB LocalDateTime을 해석하는 애플리케이션 표준 시간대
application.time.zone-id=Asia/Seoul

# 쿠폰 만료 처리 허용 지연시간(ms). 예: 30분 = 1800000
consistency.expiration.allowed-delay-ms=[agreed_delay_ms]

# JobRepository/JobOperator/JobRegistry는 com.ace.consistency.batch.BatchAsyncConfig가 직접 구성하므로
# 기본 배치 자동 설정은 제외한다(그대로 두면 같은 이름의 빈이 중복 등록되어 BeanDefinitionOverrideException 발생)
spring.autoconfigure.exclude=org.springframework.boot.batch.autoconfigure.BatchAutoConfiguration
# 쿠폰 캠페인 오픈 예약 스케줄러 (운영 환경에서 명시적으로 활성화)
coupon.campaign.open-scheduler.enabled=true
coupon.campaign.open-scheduler.initial-delay-ms=1000
coupon.campaign.open-scheduler.fixed-delay-ms=1000

# DB 저장 후 Redis 초기화에 실패한 활성 캠페인 복구 스케줄러
coupon.campaign.redis-initialization-recovery.enabled=true
coupon.campaign.redis-initialization-recovery.initial-delay-ms=5000
coupon.campaign.redis-initialization-recovery.fixed-delay-ms=10000

# 캠페인 Redis 초기화 내부 엔드포인트 노출 (기본 false). Redis 상태를 바꾸므로 명시해야 켜진다
coupon.issue.admin.enabled=false

# 발급 이력 저장 경로. SYNC = 요청 스레드에서 저장 / RELAY = Stream 소비자가 저장
# 아래 항목은 모두 기본값이 있어 없어도 기동된다
coupon.issue.persistence.mode=SYNC

# RELAY 전용 (mode=SYNC 면 사용되지 않음)
coupon.issue.persistence.consumer-group=issue-persist
coupon.issue.persistence.batch-size=100
coupon.issue.persistence.block-timeout=2s
coupon.issue.persistence.claim-min-idle=30s

# 커넥션 점유 시간 단축. SYNC 는 저장까지 같은 요청 안에서 끝난다
spring.jpa.open-in-view=false

# Consistency Check 스케쥴러.
# fixed-delay-ms: 스케쥴러가 반복하는 주기
# safety-margin-seconds: AS_OF_RANGE의 to에 now()를 그대로 쓰면 방금 커밋했지만 안 보이는 트랜잭션에 걸릴 수 있어, now() - margin으로 여유 시간을 둠
# initial-lookback-hours: VerificationResult가 존재하지 않을때, from으로 쓸 값. 기록이 없으면 기본적으로 1일 전 ~ 현재까지 검사한다.
consistency.as-of-range.fixed-delay-ms=30000
consistency.as-of-range.safety-margin-seconds=10
consistency.as-of-range.initial-lookback-hours=24
consistency.as-of-range.enabled=true
consistency.all.fixed-delay-ms=60000
consistency.all.safety-margin-seconds=10
consistency.all.enabled=true

# 쿠폰 회차 집계 스냅샷 및 상태 전환 스케쥴러
coupon.campaign.aggregate-snapshot.enabled=true
coupon.campaign.aggregate-snapshot.initial-delay-ms=5000
coupon.campaign.aggregate-snapshot.fixed-delay-ms=5000

# 확정 실패 재처리 스케쥴러
coupon.issue.confirm-retry.enabled=true
coupon.issue.confirm-retry.initial-delay-ms=10000
coupon.issue.confirm-retry.fixed-delay-ms=300000
coupon.issue.confirm-retry.batch-size=100
