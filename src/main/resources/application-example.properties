spring.application.name=ace-be

spring.datasource.url=jdbc:mysql://localhost:3307/[your_db]?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=[your_id]
spring.datasource.password=[your_pw]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Lua 단계별 실패 카운터: coupon_redis_lua_failures_total
management.endpoints.web.exposure.include=health,info,prometheus

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# 캠페인 마감 후 Redis 판정 데이터 보존 기간과 LocalDateTime 해석 기준
coupon.issue.redis.retention=PT168H
coupon.issue.redis.zone-id=Asia/Seoul

# API와 DB LocalDateTime을 해석하는 애플리케이션 표준 시간대
application.time.zone-id=Asia/Seoul

# 쿠폰 만료 처리 허용 지연시간(ms). 예: 120초 = 120000
consistency.expiration.allowed-delay-ms=120000

# JobRepository/JobOperator/JobRegistry는 com.ace.consistency.batch.BatchAsyncConfig가 직접 구성하므로
# 기본 배치 자동 설정은 제외한다(그대로 두면 같은 이름의 빈이 중복 등록되어 BeanDefinitionOverrideException 발생)
spring.autoconfigure.exclude=org.springframework.boot.batch.autoconfigure.BatchAutoConfiguration
# 쿠폰 캠페인 오픈 예약 스케줄러 (운영 환경에서 명시적으로 활성화)
coupon.campaign.open-scheduler.enabled=true
coupon.campaign.open-scheduler.initial-delay-ms=1000
coupon.campaign.open-scheduler.fixed-delay-ms=1000

coupon.expiration.scheduler.enabled=false
coupon.expiration.scheduler.initial-delay-ms=10000
coupon.expiration.scheduler.fixed-delay-ms=60000
coupon.expiration.scheduler.chunk-size=500
# DB 저장 후 Redis 초기화에 실패한 활성 캠페인 복구 스케줄러
coupon.campaign.redis-initialization-recovery.enabled=true
coupon.campaign.redis-initialization-recovery.initial-delay-ms=5000
coupon.campaign.redis-initialization-recovery.fixed-delay-ms=10000

# 캠페인 Redis 초기화 내부 엔드포인트 노출 (기본 false). Redis 상태를 바꾸므로 명시해야 켜진다
coupon.issue.admin.enabled=false

# 수동 마감 API 노출 (기본 false). 신규 발급을 즉시 차단하므로 운영자 환경에서만 명시적으로 켠다
coupon.campaign.close-admin.enabled=false

# 발급 이력 저장 경로. RELAY = Stream 소비자가 저장(기본) / SYNC = 요청 스레드에서 저장
# 최종 운영 형태가 RELAY 다. 1차/2차 비교 측정 때만 SYNC 로 바꿔 잰다
# RELAY 에서만 pendingQuantity 가 실제로 움직이고 마감 Drain 게이트가 동작한다
# 아래 항목은 모두 기본값이 있어 없어도 기동된다
coupon.issue.persistence.mode=RELAY

# RELAY 전용 (mode=SYNC 면 사용되지 않음)
coupon.issue.persistence.consumer-group=issue-persist
coupon.issue.persistence.batch-size=100
# 반드시 spring.data.redis.timeout 보다 짧게 둔다
# 같으면 Stream 이 빌 때마다 XREADGROUP BLOCK 이 그 시간을 다 쓰고 Lettuce 커맨드 타임아웃이 터진다
# 그때 이미 전달된 엔트리는 pending 에 남아 claim-min-idle 만큼 저장이 밀린다
coupon.issue.persistence.block-timeout=1s
coupon.issue.persistence.claim-min-idle=30s

# 커넥션 점유 시간 단축. 저장은 요청 밖(RELAY) 또는 요청 안(SYNC)에서 끝나고 뷰까지 열어둘 이유가 없다
spring.jpa.open-in-view=false

# Consistency Check 스케쥴러.
# fixed-delay-ms: 스케쥴러가 반복하는 주기
# safety-margin-seconds: AS_OF_RANGE의 to에 now()를 그대로 쓰면 방금 커밋했지만 안 보이는 트랜잭션에 걸릴 수 있어, now() - margin으로 여유 시간을 둠
# initial-lookback-hours: VerificationResult가 존재하지 않을때, from으로 쓸 값. 기록이 없으면 기본적으로 1일 전 ~ 현재까지 검사한다.
consistency.as-of-range.fixed-delay-ms=30000
consistency.as-of-range.safety-margin-seconds=10
consistency.as-of-range.initial-lookback-hours=24
consistency.as-of-range.enabled=true
consistency.all.fixed-delay-ms=60000
consistency.all.safety-margin-seconds=10
consistency.all.enabled=true

# 정합성 검증 위반 사항 복구 엔드포인트 노출
consistency.recovery.admin.enabled=true
# 쿠폰 회차 집계 스냅샷 및 상태 전환 스케쥴러
coupon.campaign.aggregate-snapshot.enabled=true
coupon.campaign.aggregate-snapshot.initial-delay-ms=5000
coupon.campaign.aggregate-snapshot.fixed-delay-ms=5000

# 확정 실패 재처리 스케쥴러
# 실측(로컬): 건당 3.4ms. 한 주기 1,000건 = 3.4초
# 최악 backlog 는 정오 1회차 전량 실패(10,000건)이고 1분 주기로 약 10분에 해소된다
# 회수가 끝나야 회차가 마감되고 정합성 검증 트리거가 돌기 때문에 해소 시간이 곧 검증 지연이다
coupon.issue.confirm-retry.enabled=true
coupon.issue.confirm-retry.initial-delay-ms=10000
coupon.issue.confirm-retry.fixed-delay-ms=60000
coupon.issue.confirm-retry.batch-size=1000

# 보상(재고 원복) 실패 재처리 스케쥴러
# 되돌리지 못한 재고는 Redis 에 묶여 pendingQuantity 를 0 으로 못 내리고 회차 마감을 막는다
# 되돌리기 전에 저장 여부를 다시 확인하므로 이미 저장된 건은 건드리지 않는다
coupon.issue.compensation-retry.enabled=true
coupon.issue.compensation-retry.initial-delay-ms=10000
coupon.issue.compensation-retry.fixed-delay-ms=60000
coupon.issue.compensation-retry.batch-size=1000

# ALL 스코프 배치가 비정상 종료되어 verification_result와 연결되지 못한 채 남은
# verification_violation 고아 행을 주기적으로 정리하는 스케줄러
# orphan-threshold-minutes: 행의 생성 시각이 아니라, 그 행을 태깅한 Step이 마지막으로 진행
#   (청크 커밋)한 시각 기준의 최대 무진행 허용 시간(분) — 즉 청크 하나가 걸릴 수 있는 최대
#   처리 시간으로 잡아야 한다. Step이 계속 진행 중이면 총 소요 시간과 무관하게 삭제되지 않는다
consistency.violation-cleanup.enabled=true
consistency.violation-cleanup.fixed-delay-ms=300000
consistency.violation-cleanup.orphan-threshold-minutes=30
# 실패한 ALL 배치를 기존 진행 위치부터 재시작할 수 있는 시간(분).
# 0 < restart-allowed-minutes < orphan-threshold-minutes 관계를 만족해야 하며,
# 이 시간이 지나면 기존 Job을 재시작하지 말고 새로운 ALL 검증을 시작해야 한다.
consistency.violation-cleanup.restart-allowed-minutes=25
