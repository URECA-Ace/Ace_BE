spring.application.name=ace-be

spring.datasource.url=jdbc:mysql://localhost:3307/[your_db]?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=[your_id]
spring.datasource.password=[your_pw]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# 캠페인 마감 후 Redis 판정 데이터 보존 기간과 LocalDateTime 해석 기준
coupon.issue.redis.retention=PT168H
coupon.issue.redis.zone-id=Asia/Seoul

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:org/springframework/batch/core/schema-mysql.sql
spring.batch.job.enabled=false